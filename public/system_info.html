<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raspberry Pi System Information</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .meter-track {
            background-color: #262626;
        }

        .meter-fill {
            transition: width 0.6s ease;
        }
    </style>
</head>

<body class="grid-background min-h-screen flex items-center justify-center p-4 md:p-8">
    <div class="max-w-3xl w-full">
        <!-- Back Button -->
        <div class="mb-8 fade-in">
            <a href="index.html"
                class="inline-flex items-center text-gray-400 hover:text-white transition-colors duration-300 group">
                <svg class="w-5 h-5 mr-2 transition-transform duration-300 group-hover:-translate-x-1" fill="none"
                    stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                <span
                    class="text-lg font-light border-b border-transparent group-hover:border-white transition-all duration-300">Back
                    to Portfolio</span>
            </a>
        </div>

        <!-- Header -->
        <div class="text-center mb-10 fade-in">
            <h1 class="text-5xl md:text-6xl font-light text-white mb-4 title-glow">Webserver information</h1>
            <p class="text-gray-400 text-lg font-light">Live-ish stats about the Raspberry Pi hosting this site,
                refreshed every few minutes.</p>
        </div>

        <div id="stats-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 fade-in">
            <p class="col-span-2 md:col-span-4 text-center text-gray-400 font-light">Loading stats...</p>
        </div>

        <p id="last-updated" class="text-center text-gray-500 text-sm font-light mt-6 fade-in"></p>

        <div id="footer-placeholder"></div>
    </div>

    <script src="footerscript.js"></script>
    <script>
        const ICONS = {
            model: '<rect x="6" y="6" width="12" height="12" rx="2"></rect><line x1="9" y1="3" x2="9" y2="6"></line><line x1="15" y1="3" x2="15" y2="6"></line><line x1="9" y1="18" x2="9" y2="21"></line><line x1="15" y1="18" x2="15" y2="21"></line><line x1="3" y1="9" x2="6" y2="9"></line><line x1="3" y1="15" x2="6" y2="15"></line><line x1="18" y1="9" x2="21" y2="9"></line><line x1="18" y1="15" x2="21" y2="15"></line>',
            os: '<rect x="3" y="4" width="18" height="16" rx="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line>',
            uptime: '<circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.5 2"></path>',
            cores: '<rect x="6" y="6" width="12" height="12" rx="1"></rect><line x1="9" y1="6" x2="9" y2="18"></line><line x1="15" y1="6" x2="15" y2="18"></line><line x1="6" y1="9" x2="18" y2="9"></line><line x1="6" y1="15" x2="18" y2="15"></line>',
            temp: '<rect x="10" y="3" width="4" height="11" rx="2"></rect><circle cx="12" cy="17" r="4"></circle>',
            load: '<path d="M4 15a8 8 0 1116 0"></path><line x1="12" y1="15" x2="15" y2="10"></line>',
            mem: '<rect x="4" y="8" width="16" height="8" rx="1"></rect><line x1="8" y1="8" x2="8" y2="5"></line><line x1="12" y1="8" x2="12" y2="5"></line><line x1="16" y1="8" x2="16" y2="5"></line>',
            disk: '<ellipse cx="12" cy="6" rx="8" ry="3"></ellipse><path d="M4 6v12c0 1.66 3.58 3 8 3s8-1.34 8-3V6"></path><path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"></path>'
        };

        const STATUS = { good: '#0ca30c', warning: '#fab219', critical: '#d03b3b' };

        function severity(pct, warnAt, critAt) {
            if (pct >= critAt) return 'critical';
            if (pct >= warnAt) return 'warning';
            return 'good';
        }

        function icon(name) {
            return `<svg class="w-6 h-6 mr-2 text-gray-300 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">${ICONS[name]}</svg>`;
        }

        function infoTile(name, label, value) {
            return `<section class="bg-gray-900/60 border border-gray-800 rounded-lg p-4 flex flex-col">
                <h2 class="text-white text-sm font-medium mb-2 flex items-center">${icon(name)}${label}</h2>
                <p class="text-gray-200 text-lg font-light mt-auto">${value}</p>
            </section>`;
        }

        function meterTile(name, label, value, pct, warnAt, critAt) {
            const clamped = Math.max(0, Math.min(100, pct));
            const color = STATUS[severity(pct, warnAt, critAt)];
            return `<section class="bg-gray-900/60 border border-gray-800 rounded-lg p-4 flex flex-col">
                <h2 class="text-white text-sm font-medium mb-2 flex items-center">${icon(name)}${label}</h2>
                <p class="text-gray-200 text-lg font-light">${value}</p>
                <div class="meter-track w-full h-1.5 rounded-full mt-2 overflow-hidden">
                    <div class="meter-fill h-full rounded-full" style="width:${clamped}%;background-color:${color};"></div>
                </div>
            </section>`;
        }

        function render(data) {
            const tiles = [
                meterTile('temp', 'CPU temperature', `${data.cpu_temp_c}°C`, (data.cpu_temp_c / 85) * 100, 70, 80),
                meterTile('load', 'CPU load (1 min)', `${data.load_1_pct}%`, data.load_1_pct, 70, 90),
                meterTile('mem', 'Memory', `${data.mem_used_gb} / ${data.mem_total_gb} GB (${data.mem_pct}%)`, data.mem_pct, 70, 90),
                meterTile('disk', 'Disk', `${data.disk_used_gb} / ${data.disk_total_gb} GB (${data.disk_pct}%)`, data.disk_pct, 70, 90),
                infoTile('uptime', 'Uptime', data.uptime_pretty),
                infoTile('model', 'Model', data.model),
                infoTile('os', 'OS', data.os),
                infoTile('cores', 'CPU cores', data.cpu_cores)
            ];
            $('#stats-grid').html(tiles.join(''));

            const generated = new Date(data.generated_at);
            $('#last-updated').text(`Last updated ${generated.toLocaleString()}`);
        }

        function fetchSystemInfo() {
            $.getJSON('system_info.json')
                .done(render)
                .fail(function () {
                    $('#stats-grid').html('<p class="col-span-2 md:col-span-4 text-center text-gray-400 font-light">Stats are temporarily unavailable.</p>');
                });
        }

        $(document).ready(fetchSystemInfo);
    </script>
</body>

</html>
